[project]
name = "stage-05-context"
version = "0.1.0"
description = "SE373 Buổi 7, Challenge B: compaction (B1) và Code Mode (B2) trên agent của lab Buổi 4"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.3,<2",
    "langchain-openai>=1.6.7,<2",
    "python-dotenv>=1.2.4,<2",
    "pyyaml>=6.0.3,<7",
    "streamlit>=1.65.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
